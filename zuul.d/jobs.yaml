# DNM
---
- job:
    name: barbican-operator-kuttl
    parent: cifmw-base-multinode-kuttl
    attempts: 1
    required-projects:
      - github.com/openstack-k8s-operators/barbican-operator
    irrelevant-files:
      - .*/*.md
      - ^\..*$
      - ^LICENSE$
      - ^OWNERS$
      - ^OWNERS_ALIASES$
      - ^PROJECT$
      - ^README.md$
      - tests?\/functional
      - ^renovate.json$
    vars:
      cifmw_kuttl_tests_operator_list:
        - barbican

- job:
    name: barbican-operator-tempest
    parent: podified-multinode-edpm-deployment-crc-2comp
    vars:
      cifmw_test_operator_tempest_concurrency: 3
      cifmw_test_operator_tempest_include_list: |
        ^barbican_tempest_plugin.tests.(api|rbac)\.

- job:
    name: barbican-s2i-content-provider
    parent: s2i-openstack-container-content-provider
    description: |
      Build s2i barbican service images for barbican-s2i-test and
      barbican-s2i-test-ceph.
    required-projects:
      - name: openstack-k8s-operators/s2i-openstack-containers
        override-checkout: main
    vars:
      s2i_ci_images:
        - barbican/barbican-api

- job:
    name: barbican-s2i-test
    parent: s2i-test-base
    description: |
      Validate speculatively-built s2i barbican images against a live
      OpenStack deployment. s2i-built images from the content provider
      are applied to OpenStackVersion during edpm_prepare via ci-framework
      set_containers before the control plane is deployed. Runs Barbican API
      and RBAC Tempest tests on the standard CRC topology.
    vars:
      cifmw_test_operator_tempest_concurrency: 3
      cifmw_test_operator_tempest_tempestconf_config:
        overrides: |
          barbican_tempest.enable_multiple_secret_stores true
          key_manager.max_microversion latest
          enforce_scope.barbican true
      cifmw_test_operator_tempest_include_list: |
        ^barbican_tempest_plugin.tests.(api|rbac)\.

- job:
    name: barbican-s2i-test-ceph
    parent: s2i-test-base-ceph
    description: |
      Validate speculatively-built s2i barbican images against a live
      OpenStack deployment with Ceph backends. s2i-built images from the
      content provider are applied to OpenStackVersion during edpm_prepare
      via ci-framework set_containers before the control plane is deployed.
      Runs Barbican API and RBAC Tempest tests on the standard CRC topology
      with Ceph backends.
    vars:
      # Do not set s2i_cinder_volume_backends: that injects an S2I-built
      # openstack-cinder-volume image, but barbican-s2i-content-provider
      # only builds barbican-api. Leave the default [] so volume1 keeps
      # the quay payload image; Ceph config still comes from the HCI parent.
      cifmw_cephadm_min_compat_client: mimic
      cifmw_edpm_deploy_nova_compute_extra_config: |
        [key_manager]
        backend=barbican
        [glance]
        verify_glance_signatures = true
      cifmw_test_operator_tempest_concurrency: 3
      cifmw_test_operator_tempest_tempestconf_config:
        overrides: |
          barbican_tempest.enable_multiple_secret_stores true
          key_manager.max_microversion latest
          enforce_scope.barbican true
      cifmw_test_operator_tempest_include_list: |
        ^barbican_tempest_plugin.tests..*
      cifmw_test_operator_tempest_exclude_list: |
        ^barbican_tempest_plugin.tests.scenario.test_volume_encryption.VolumeEncryptionTest.test_encrypted_cinder_volumes_cryptsetup
